# Render deployment config. Connect this repo at https://render.com and it
# picks these settings up automatically - no manual form filling.
services:
  - type: web
    name: heart-disease-prediction
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # --chdir so relative paths in app.py resolve, and bind to the port
    # Render assigns us.
    startCommand: gunicorn --chdir heart-disease-app --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
